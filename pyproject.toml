[project]
name = "toolhint"
version = "0.1.0"
description = "Local Laya classifier that suggests relevant skills, connectors and tools for each prompt"
requires-python = ">=3.12"
dependencies = [
    "laya==0.3.20",
    "mcp==2.2.0",
    "pyyaml>=6",
]

[project.scripts]
toolhint = "toolhint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolhint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: loads the real Laya checkpoint (~850 MB download on first run)"]
addopts = "-m 'not slow'"
